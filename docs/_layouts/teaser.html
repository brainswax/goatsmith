<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title | default: "Goatsmith" }}</title>
  {% if page.excerpt %}<meta name="description" content="{{ page.excerpt | strip_html }}">{% endif %}
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-04G7FFBS9Z"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag("js", new Date());
    gtag("config", "G-04G7FFBS9Z");
  </script>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
    }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fff;
      color: #1a1a1a;
      font-family: "PT Sans Narrow", "Helvetica Neue", Helvetica, Arial, sans-serif;
    }
    .teaser {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2rem;
      width: min(40rem, calc(100vw - 2.5rem));
      padding: 2rem 0;
    }
    .teaser h1 {
      margin: 0;
      padding: 0;
      width: 100%;
      font-size: 0;
      line-height: 0;
      text-align: center;
    }
    .teaser img {
      display: block;
      width: 100%;
      height: auto;
      margin: 0 auto;
    }
    .teaser-video {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #111;
    }
    .teaser-video iframe,
    .teaser-video-slot {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
    }
    .teaser-signup {
      display: inline-block;
      margin: 0;
      padding: 0.7rem 1.6rem;
      border: 1px solid #c9a227;
      background: #1a1a1a;
      color: #fff;
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-decoration: none;
      text-transform: uppercase;
    }
    .teaser-signup:hover,
    .teaser-signup:focus {
      background: #000;
      color: #fff;
      border-color: #e0c15a;
    }
  </style>
</head>
<body>
  <div class="teaser">
    <h1>
      <img
        src="/assets/images/goatsmith-logo.jpg"
        alt="Goatsmith. Forging better goats."
        width="715"
        height="240"
      />
    </h1>
    <div class="teaser-video">
      {% if site.teaser.youtube_id and site.teaser.youtube_id != "" %}
      <iframe
        src="https://www.youtube-nocookie.com/embed/{{ site.teaser.youtube_id }}"
        title="Goatsmith"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
        allowfullscreen
      ></iframe>
      {% else %}
      <div class="teaser-video-slot" role="img" aria-label="Video"></div>
      {% endif %}
    </div>
    {% if site.teaser.signup_url and site.teaser.signup_url != "" %}
    <a class="teaser-signup" href="{{ site.teaser.signup_url }}">{{ site.teaser.signup_label | default: "Sign up" }}</a>
    {% endif %}
  </div>
</body>
</html>
